<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>Сканирование QR</title>


  <!--
    Библиотека QR-сканера.

    ВАЖНО:
    здесь она работает уже НЕ внутри
    Apps Script sandbox.
  -->
  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 16px;

      background: #111827;

      color: white;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      min-height: 100vh;
    }


    .app {

      width: min(600px, 100%);

      margin: 0 auto;

      text-align: center;
    }


    h1 {

      margin:
        8px 0 18px;

      font-size: 25px;
    }


    .status {

      margin-bottom: 14px;

      color: #d1d5db;

      font-size: 15px;
    }


    #reader {

      width: 100%;

      overflow: hidden;

      border-radius: 18px;

      background: #000;
    }


    #reader video {

      border-radius: 18px;
    }


    #reader__scan_region {

      border-radius: 18px;
    }


    button {

      width: 100%;

      min-height: 52px;

      margin-top: 14px;

      padding: 10px 14px;

      border: 0;

      border-radius: 12px;

      background: white;

      color: #111827;

      font-size: 17px;

      font-weight: 700;
    }


    button:active {

      transform: scale(.98);
    }


    .error {

      margin-top: 14px;

      padding: 14px;

      border-radius: 12px;

      background: #7f1d1d;

      color: white;

      display: none;
    }


    .success {

      margin-top: 14px;

      padding: 16px;

      border-radius: 12px;

      background: #14532d;

      color: white;

      display: none;

      font-size: 18px;

      font-weight: 700;
    }


    .hint {

      margin-top: 14px;

      color: #9ca3af;

      font-size: 14px;

      line-height: 1.45;
    }

  </style>

</head>


<body>


<div class="app">

  <h1>
    📷 Сканирование QR
  </h1>


  <div
    id="status"
    class="status"
  >
    Запрашиваем доступ к камере…
  </div>


  <div id="reader"></div>


  <div
    id="error"
    class="error"
  ></div>


  <div
    id="success"
    class="success"
  >
    QR-код распознан!
  </div>


  <button
    id="closeBtn"
    onclick="closeCamera()"
  >
    Закрыть
  </button>


  <div class="hint">

    Наведите камеру на QR-код участника.
    <br>
    После распознавания окно можно закрыть.

  </div>

</div>


<script>


  /*
   * Получаем параметры,
   * переданные Index.html.
   */

  const params =
    new URLSearchParams(
      window.location.search
    );


  /*
   * Origin родительского окна.
   *
   * Например:
   * https://script.google.com
   */
  const returnOrigin =
    params.get('returnOrigin') || '';


  /*
   * ID текущей сессии.
   */
  const sessionId =
    params.get('session') || '';


  let scanner = null;

  let sent = false;


  /**
   * Проверяем returnOrigin.
   *
   * Мы разрешаем только HTTPS.
   */
  function isValidReturnOrigin() {

    if (!returnOrigin) {
      return false;
    }


    try {

      const url =
        new URL(returnOrigin);


      return (
        url.protocol === 'https:'
      );

    } catch (e) {

      return false;
    }
  }


  /**
   * Обновить статус.
   */
  function setStatus(text) {

    document
      .getElementById('status')
      .textContent = text;
  }


  /**
   * Показать ошибку.
   */
  function showError(text) {

    const box =
      document.getElementById(
        'error'
      );


    box.textContent = text;

    box.style.display =
      'block';


    setStatus(
      'Не удалось запустить камеру.'
    );
  }


  /**
   * Отправляем результат
   * обратно в Index.html.
   */
  function sendResult(decodedText) {

    if (sent) {
      return;
    }


    if (
      !isValidReturnOrigin()
    ) {

      showError(
        'Не указан корректный адрес ' +
        'родительского приложения.'
      );

      return;
    }


    const value =
      String(decodedText || '').trim();


    if (!value) {
      return;
    }


    if (value.length > 200) {

      showError(
        'QR-код содержит слишком много данных.'
      );

      return;
    }


    sent = true;


    /*
     * Передаём результат в Index.html.
     *
     * Используем конкретный targetOrigin,
     * а не "*".
     */
    try {

      window.opener.postMessage(

        {
          type: 'QR_SCANNED',

          value: value,

          session: sessionId
        },

        returnOrigin
      );

    } catch (e) {

      showError(
        'Не удалось передать QR-код ' +
        'в основное приложение.'
      );

      sent = false;

      return;
    }


    /*
     * Останавливаем камеру.
     */
    stopScanner();


    document
      .getElementById('success')
      .style.display = 'block';


    setStatus(
      'QR-код распознан. Возвращаемся…'
    );


    /*
     * Пытаемся закрыть вкладку/окно.
     *
     * Если браузер не разрешит,
     * ничего страшного:
     * пользователь увидит результат
     * в основном приложении.
     */
    setTimeout(() => {

      try {

        window.close();

      } catch (e) {}

    }, 300);
  }


  /**
   * Запускает QR-сканер.
   */
  async function startScanner() {

    if (sent) {
      return;
    }


    if (
      typeof Html5Qrcode ===
      'undefined'
    ) {

      showError(
        'Не удалось загрузить библиотеку QR-сканера.'
      );

      return;
    }


    try {

      scanner =
        new Html5Qrcode(
          'reader'
        );


      setStatus(
        'Запрашиваем доступ к камере…'
      );


      await scanner.start(

        {
          facingMode:
            {
              ideal:
                'environment'
            }
        },

        {

          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          },

          aspectRatio: 1.0

        },

        decodedText => {

          sendResult(
            decodedText
          );

        },

        () => {
          /*
           * Ошибки отдельных кадров
           * игнорируем.
           */
        }
      );


      setStatus(
        'Камера работает. Наведите её на QR-код.'
      );


    } catch (err) {

      console.error(err);


      let message =
        'Не удалось получить доступ к камере.';


      if (
        err &&
        String(err)
          .toLowerCase()
          .includes('permission')
      ) {

        message =
          'Браузер не разрешил доступ к камере. ' +
          'Разрешите использование камеры ' +
          'для этой страницы и попробуйте снова.';

      } else if (
        err &&
        String(err)
          .toLowerCase()
          .includes('notallowed')
      ) {

        message =
          'Доступ к камере запрещён. ' +
          'Разрешите камеру для этого сайта ' +
          'в настройках браузера.';
      }


      showError(
        message +
        '\n\nТехническая информация: ' +
        String(err)
      );
    }
  }


  /**
   * Останавливает камеру.
   */
  async function stopScanner() {

    if (!scanner) {
      return;
    }


    try {

      await scanner.stop();

    } catch (e) {}


    try {

      scanner.clear();

    } catch (e) {}


    scanner = null;
  }


  /**
   * Закрытие камеры.
   */
  async function closeCamera() {

    await stopScanner();


    try {

      window.close();

    } catch (e) {}


    setStatus(
      'Камера остановлена.'
    );
  }


  /*
   * Запускаем камеру после загрузки.
   */
  window.addEventListener(
    'load',
    () => {

      if (
        !window.opener
      ) {

        showError(
          'Эта страница должна быть открыта ' +
          'из приложения посещаемости.'
        );

        return;
      }


      if (
        !isValidReturnOrigin()
      ) {

        showError(
          'Некорректный адрес родительского приложения.'
        );

        return;
      }


      startScanner();
    }
  );


  /*
   * Если пользователь закрывает страницу,
   * пытаемся остановить камеру.
   */
  window.addEventListener(
    'beforeunload',
    () => {

      try {

        if (scanner) {
          scanner.stop();
        }

      } catch (e) {}
    }
  );

</script>


</body>

</html>
