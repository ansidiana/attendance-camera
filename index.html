<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Сканирование QR!!! Ура!!!</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin: 10px 0 15px;
    }

    #status {
      margin: 10px auto 15px;
      padding: 12px;
      border-radius: 10px;
      background: white;
      max-width: 500px;
      font-size: 16px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    button {
      display: inline-block;
      margin: 10px 5px;
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
    }

    #startButton {
      background: #1976d2;
      color: white;
    }

    #stopButton {
      background: #777;
      color: white;
      display: none;
    }

    #backButton {
      background: #ddd;
      color: #222;
    }

    #error {
      display: none;
      margin: 15px auto;
      padding: 15px;
      max-width: 500px;
      background: #ffe5e5;
      border-radius: 10px;
      color: #a00000;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .hint {
      max-width: 500px;
      margin: 15px auto;
      color: #666;
      line-height: 1.4;
    }
  </style>
</head>

<body>

  <h1>📷 Сканирование QR-кода</h1>

  <div id="status">
    Нажмите «Включить камеру».
  </div>

  <div id="reader"></div>

  <div id="error"></div>

  <div>
    <button id="startButton" onclick="startCamera()">
      📷 Включить камеру
    </button>

    <button id="stopButton" onclick="stopCamera()">
      ⏹ Остановить
    </button>

    <button id="backButton" onclick="goBack()">
      ← Вернуться
    </button>
  </div>

  <div class="hint">
    Разрешите доступ к камере, затем наведите камеру на QR-код участника.
  </div>

<script>

  let scanner = null;
  let cameraRunning = false;
  let processingScan = false;

  /*
   * Адрес страницы приложения, которое открыло камеру.
   */
  const params = new URLSearchParams(window.location.search);
  const returnOrigin = params.get("returnOrigin");

  /*
   * Если Camera.html открыт напрямую, а не из приложения,
   * возвращать результат некуда.
   */
  if (!returnOrigin) {
    showError(
      "Эта страница должна быть открыта из приложения посещаемости.\n\n" +
      "Откройте приложение и нажмите «Начать сканирование»."
    );
  }

  /*
   * Отправка сообщения обратно в приложение.
   */
  function sendToParent(message) {

    if (!window.opener || window.opener.closed) {
      showError(
        "Не удалось связаться с приложением посещаемости.\n\n" +
        "Вернитесь в приложение и попробуйте ещё раз."
      );
      return;
    }

    window.opener.postMessage(message, returnOrigin);
  }


  /*
   * Запуск камеры.
   */
  async function startCamera() {

    if (!returnOrigin) {
      return;
    }

    if (cameraRunning) {
      return;
    }

    hideError();

    setStatus("Получаем список доступных камер…");

    document.getElementById("startButton").disabled = true;

    try {

      /*
       * Получаем реальные камеры устройства.
       *
       * Это надёжнее, чем сразу передавать facingMode.
       */
      const cameras = await Html5Qrcode.getCameras();

      if (!cameras || cameras.length === 0) {
        throw new Error("Камеры на устройстве не найдены.");
      }

      /*
       * Пытаемся выбрать заднюю камеру.
       *
       * На разных устройствах название может быть:
       * "back", "rear", "environment" и т.п.
       */
      let selectedCamera = cameras.find(camera => {

        const label = (camera.label || "").toLowerCase();

        return (
          label.includes("back") ||
          label.includes("rear") ||
          label.includes("environment") ||
          label.includes("зад")
        );

      });

      /*
       * Если определить заднюю камеру по названию не удалось,
       * берём первую доступную.
       */
      if (!selectedCamera) {
        selectedCamera = cameras[0];
      }

      setStatus(
        "Камера: " +
        (selectedCamera.label || "камера устройства") +
        "\n\nНаводите камеру на QR-код."
      );

      scanner = new Html5Qrcode("reader");

      const config = {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      };

      await scanner.start(
        selectedCamera.id,
        config,
        onScanSuccess,
        onScanError
      );

      cameraRunning = true;

      document.getElementById("startButton").style.display = "none";
      document.getElementById("stopButton").style.display = "inline-block";

      setStatus("📷 Камера работает. Наведите её на QR-код.");

      sendToParent({
        type: "CAMERA_READY"
      });

    } catch (error) {

      console.error(error);

      document.getElementById("startButton").disabled = false;

      let message = "";

      if (error && error.name === "NotAllowedError") {

        message =
          "Браузер не разрешил доступ к камере.\n\n" +
          "Проверьте разрешение камеры для сайта " +
          window.location.hostname +
          " и попробуйте ещё раз.";

      } else if (error && error.name === "NotFoundError") {

        message =
          "Камера не найдена на этом устройстве.";

      } else {

        message =
          "Не удалось получить доступ к камере.\n\n" +
          "Техническая информация:\n" +
          String(error && error.message ? error.message : error);
      }

      showError(message);

      sendToParent({
        type: "CAMERA_ERROR",
        error: message
      });
    }
  }


  /*
   * Успешно найден QR-код.
   */
  async function onScanSuccess(decodedText, decodedResult) {

    if (processingScan) {
      return;
    }

    processingScan = true;

    console.log("QR:", decodedText);

    setStatus("✅ QR-код найден!");

    await stopCamera();

    /*
     * Передаём текст QR-кода обратно в Index.html.
     */
    sendToParent({
      type: "QR_SCANNED",
      text: String(decodedText)
    });

    /*
     * Даём родительской странице время получить сообщение,
     * после чего пытаемся закрыть вкладку.
     */
    setTimeout(() => {
      try {
        window.close();
      } catch (e) {
        // Ничего страшного, пользователь может вернуться вручную.
      }
    }, 500);
  }


  /*
   * Ошибки отдельных кадров при сканировании.
   *
   * Их НЕ показываем пользователю:
   * отсутствие QR-кода в конкретном кадре — это нормально.
   */
  function onScanError(errorMessage) {
    // Ничего не делаем.
  }


  /*
   * Остановка камеры.
   */
  async function stopCamera() {

    if (!scanner) {
      return;
    }

    try {

      if (cameraRunning) {
        await scanner.stop();
      }

    } catch (error) {

      console.warn("Ошибка остановки камеры:", error);

    }

    try {
      scanner.clear();
    } catch (error) {
      console.warn("Ошибка очистки сканера:", error);
    }

    scanner = null;
    cameraRunning = false;

    document.getElementById("stopButton").style.display = "none";
    document.getElementById("startButton").style.display = "inline-block";
    document.getElementById("startButton").disabled = false;
  }


  /*
   * Получаем команды от Index.html.
   */
  window.addEventListener("message", async function(event) {

    /*
     * Принимаем команды только от того origin,
     * который был передан при открытии страницы.
     */
    if (event.origin !== returnOrigin) {
      return;
    }

    if (!event.data || typeof event.data !== "object") {
      return;
    }

    if (event.data.type === "STOP_CAMERA") {
      await stopCamera();
    }

  });


  /*
   * Кнопка "Вернуться".
   */
  async function goBack() {

    await stopCamera();

    try {
      window.close();
    } catch (e) {
      // Браузер может запретить закрытие вкладки.
    }
  }


  function setStatus(text) {
    document.getElementById("status").textContent = text;
  }


  function showError(text) {

    const element = document.getElementById("error");

    element.textContent = text;
    element.style.display = "block";

    setStatus("⚠️ Не удалось запустить камеру.");
  }


  function hideError() {

    document.getElementById("error").style.display = "none";
  }

</script>

</body>
</html>
